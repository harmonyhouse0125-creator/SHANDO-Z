<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shando'z Cafe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Musik -->
    <audio id="bgm" loop>
        <source src="Valir Phoenix (1)(1).mp3" type="audio/mpeg">
    </audio>

    <script>
        // Biar musik mulai setelah user klik (wajib di browser modern)
        document.addEventListener("click", function() {
            let audio = document.getElementById("bgm");
            audio.volume = 0.4;
            audio.play().catch(() => {});
        }, { once: true });
    </script>

    <div class="hero">
        <h1>Shando'z Cafe & Coffee Bar</h1>
        <p>Hitam Coklat. Musik Nyantai. Kopi Mantap.</p>
        <a href="menu.html" class="btn">Lihat Menu</a>
    </div>

</body>
</html>
